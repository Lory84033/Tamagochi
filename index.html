<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tamagochi+</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --vh: 1vh;
  --bg:#F3EFFF; --bg2:#EAF6FF;
  --surface:#FFFFFF; --surface-soft:#F7F5FF;
  --primary:#7C5CFC; --primary-dark:#5F3DE0;
  --accent:#FF6FA5; --accent-soft:#FFE1ED;
  --mint:#34D399; --mint-soft:#DBFBEE;
  --sun:#FFB648; --sun-soft:#FFF0DA;
  --danger:#FF5C7A; --danger-soft:#FFE3E8;
  --ink:#2D2A4A; --ink-soft:#8A85AA;
  --line:#EAE5FB;
  --radius:22px;
  --shadow:0 10px 30px rgba(92,68,220,.12);
  --shadow-sm:0 4px 14px rgba(92,68,220,.10);
}
[data-theme="dark"]{
  --bg:#151228; --bg2:#171335;
  --surface:#201C3D; --surface-soft:#241F47;
  --ink:#F1EEFF; --ink-soft:#A9A2D6; --line:#302A57;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%; overflow:hidden;}
img{max-width:100%;}
body{
  font-family:'Nunito',sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%, var(--bg2) 0%, transparent 55%),
    radial-gradient(circle at 100% 30%, #FFE9F3 0%, transparent 45%),
    var(--bg);
  min-height:100vh; min-height:100dvh; min-height:calc(var(--vh,1vh)*100);
  display:flex; justify-content:center; align-items:flex-start;
  overscroll-behavior:none;
}
h1,h2,h3,h4,.display{font-family:'Fredoka',sans-serif; margin:0; font-weight:600;}
button{font-family:inherit; cursor:pointer;}
#phone{
  width:100%; max-width:430px;
  height:100vh; height:100dvh; height:calc(var(--vh,1vh) * 100);
  background:var(--bg); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(92,68,220,.15);
}
@media(min-width:431px){
  #phone{
    height:92vh; height:92dvh; height:calc(var(--vh,1vh) * 92);
    margin-top:4vh; border-radius:38px; border:8px solid var(--surface);
  }
}
#screen{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:calc(14px + env(safe-area-inset-top)) 16px 100px; -ms-overflow-style:none; scrollbar-width:none;}
#screen::-webkit-scrollbar{display:none;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 14px;}
.topbar .title{font-size:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.coin-pill{display:flex; align-items:center; gap:6px; background:var(--sun-soft); color:#9A6100; padding:6px 12px; border-radius:20px; font-weight:800; font-size:14px; flex-shrink:0;}
.icon-btn{width:40px; height:40px; border-radius:14px; border:none; background:var(--surface); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); color:var(--primary); font-size:16px; flex-shrink:0;}
.card{background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); margin-bottom:14px;}
.btn{border:none; border-radius:16px; padding:13px 18px; font-weight:800; font-size:15px; display:inline-flex; align-items:center; gap:8px; justify-content:center; transition:transform .12s ease, box-shadow .12s ease; -webkit-appearance:none;}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 8px 18px rgba(124,92,252,.35); width:100%;}
.btn-accent{background:var(--accent); color:#fff; box-shadow:0 8px 18px rgba(255,111,165,.35);}
.btn-mint{background:var(--mint); color:#fff;}
.btn-soft{background:var(--surface-soft); color:var(--primary); border:2px solid var(--line);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px; font-size:13px; border-radius:12px;}
input,select,textarea{
  width:100%; border:2px solid var(--line); background:var(--surface-soft); border-radius:14px;
  padding:12px 14px; font-family:'Nunito',sans-serif; font-size:15px; color:var(--ink); outline:none; -webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
label{font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row > *{flex:1; min-width:0;}
.center{text-align:center;}
.muted{color:var(--ink-soft); font-size:13px;}
.hidden{display:none !important;}
.pill{display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:800;}
.pill-admin{background:linear-gradient(135deg,#FFD166,#FF7AB8); color:#fff;}
.pill-pending{background:var(--sun-soft); color:#9A6100;}
.pill-approved{background:var(--mint-soft); color:#127A54;}
.pill-rejected{background:var(--danger-soft); color:var(--danger);}
.pill-official{background:var(--primary); color:#fff;}

/* Bottom nav */
.navbar{
  position:absolute; bottom:0; left:0; right:0; height:auto; min-height:70px;
  background:var(--surface); display:flex; border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(92,68,220,.08); padding:6px 2px calc(6px + env(safe-area-inset-bottom)); z-index:20;
}
.nav-btn{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-soft); font-size:10.5px; font-weight:800; position:relative; padding:4px 2px; min-width:0;}
.nav-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
.nav-btn i{font-size:18px;}
.nav-btn.active{color:var(--primary);}
.nav-btn.active::before{content:''; position:absolute; top:0; width:22px; height:3px; border-radius:3px; background:var(--primary);}

/* Auth */
.auth-wrap{min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:10px 4px 30px;}
.avatar-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; max-height:170px; overflow-y:auto; padding:4px;}
.avatar-opt{font-size:24px; text-align:center; padding:8px 0; border-radius:12px; background:var(--surface-soft); border:2px solid transparent;}
.avatar-opt.selected{border-color:var(--primary); background:var(--accent-soft);}
.profile-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0;}
.profile-chip{background:var(--surface); border-radius:18px; padding:14px 6px; text-align:center; box-shadow:var(--shadow-sm); border:2px solid transparent;}
.profile-chip .av{font-size:30px;}
.profile-chip .nm{font-size:12px; font-weight:800; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tabbar2{display:flex; background:var(--surface-soft); border-radius:14px; padding:4px; margin-bottom:18px;}
.tabbar2 button{flex:1; border:none; background:none; padding:10px 4px; border-radius:11px; font-weight:800; color:var(--ink-soft); font-size:12.5px;}
.tabbar2 button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-sm);}

/* Pet stage */
.pet-stage{
  background:linear-gradient(180deg,#DCEBFF 0%, #F0EBFF 100%); border-radius:26px; padding:26px 10px 16px;
  text-align:center; position:relative; overflow:hidden; margin-bottom:16px;
}
[data-theme="dark"] .pet-stage{background:linear-gradient(180deg,#232055,#1c1a3a);}
.pet-emoji{font-size:min(86px,20vw); display:inline-block; animation:bob 2.6s ease-in-out infinite; filter:drop-shadow(0 10px 10px rgba(0,0,0,.12));}
.pet-emoji.sad{animation:none; filter:drop-shadow(0 10px 10px rgba(0,0,0,.12)) grayscale(.15);}
.pet-emoji.sleep{animation:none; opacity:.85;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-70px);opacity:0;}}
@keyframes popIn{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.float-emote{position:absolute; font-size:22px; animation:floatUp 1.1s ease-out forwards; pointer-events:none;}
.petname{font-size:19px; margin-top:6px;}
.stagebadge{font-size:11px; font-weight:800; color:var(--primary); background:#fff8; display:inline-block; padding:3px 10px; border-radius:20px; margin-top:2px;}
.levelbar{height:8px; background:#ffffff88; border-radius:10px; overflow:hidden;}
.levelbar-fill{height:100%; background:linear-gradient(90deg,var(--sun),var(--accent)); transition:width .4s ease;}
.stats{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.stat-row{display:flex; align-items:center; gap:10px;}
.stat-row i{width:22px; text-align:center; flex-shrink:0;}
.bar{flex:1; height:11px; background:var(--surface-soft); border-radius:20px; overflow:hidden; min-width:0;}
.bar-fill{height:100%; border-radius:20px; transition:width .4s ease;}
.actions-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;}
.action-btn{background:var(--surface); border:none; border-radius:16px; padding:10px 2px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; font-weight:800; color:var(--ink); min-width:0;}
.action-btn i{font-size:18px; color:var(--primary);}
.action-btn:active{transform:scale(.92);}
.action-btn:disabled{opacity:.5;}

/* pixel grid */
.pixel-grid{display:grid; gap:2px; background:var(--line); border-radius:12px; padding:6px; margin:0 auto; touch-action:none; max-width:100%;}
.pixel-cell{aspect-ratio:1; border-radius:2px; background:
  linear-gradient(45deg,#e9e6f7 25%,transparent 25%),linear-gradient(-45deg,#e9e6f7 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#e9e6f7 75%),linear-gradient(-45deg,transparent 75%,#e9e6f7 75%);
  background-size:8px 8px; background-position:0 0,0 4px,4px -4px,-4px 0px;
}
.palette{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.swatch{width:30px; height:30px; border-radius:9px; border:2px solid var(--line);}
.swatch.selected{border-color:var(--ink); transform:scale(1.1);}

/* modal */
.overlay{position:absolute; inset:0; background:rgba(30,20,60,.45); display:flex; align-items:flex-end; z-index:50; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);}
.sheet{background:var(--surface); width:100%; border-radius:26px 26px 0 0; padding:22px 18px calc(26px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:sheetUp .25s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:40px; height:5px; background:var(--line); border-radius:4px; margin:0 auto 14px;}

/* toast */
#toast-wrap{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:1200; pointer-events:none;}
.toast{background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; font-weight:700; box-shadow:0 8px 20px rgba(0,0,0,.25); animation:popIn .25s ease; max-width:90%; text-align:center;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--mint);}

/* lists */
.list-item{display:flex; align-items:center; gap:10px; padding:12px; border-radius:16px; background:var(--surface-soft); margin-bottom:10px; flex-wrap:wrap;}
.list-item .av{font-size:26px; width:40px; text-align:center; flex-shrink:0;}
.list-item .meta{flex:1; min-width:80px;}
.list-item .meta .n{font-weight:800; font-size:14px;}
.list-item .meta .s{font-size:12px; color:var(--ink-soft);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.game-card,.skin-card{background:var(--surface-soft); border-radius:18px; padding:14px; text-align:center;}
.game-card .gi,.skin-card .gi{font-size:34px; margin-bottom:6px;}
.empty-state{text-align:center; padding:40px 10px; color:var(--ink-soft);}
.empty-state i{font-size:38px; margin-bottom:10px; color:var(--line);}
.reflex-arena{position:relative; width:100%; height:min(340px,55vh); border-radius:20px; overflow:hidden; background:#cfe8ff; touch-action:manipulation;}
.reflex-target{position:absolute; font-size:34px; background:none; border:none; transform:translate(-50%,-50%); animation:popIn .15s ease;}
.quiz-opt{width:100%; text-align:left; margin-bottom:10px; padding:14px; border-radius:14px; border:2px solid var(--line); background:var(--surface-soft); font-weight:700; font-size:14px;}
.quiz-opt.correct{border-color:var(--mint); background:var(--mint-soft);}
.quiz-opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
.spinner{width:34px; height:34px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--primary); animation:spin .8s linear infinite; margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.switch{position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--line); border-radius:30px; transition:.2s;}
.slider::before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
input:checked + .slider{background:var(--primary);}
input:checked + .slider::before{transform:translateX(20px);}
.section-title{font-size:13px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 8px 2px;}
.divider{height:1px; background:var(--line); margin:12px 0;}

/* shop / sticker icons */
.shop-item{background:var(--surface-soft); border-radius:16px; padding:12px; text-align:center; position:relative;}
.shop-item.locked{opacity:.5;}
.lock-badge{position:absolute; top:8px; right:8px; font-size:10px; background:var(--ink); color:#fff; padding:2px 7px; border-radius:10px; font-weight:800;}
.emoji-badge{width:52px; height:52px; border-radius:16px; background:linear-gradient(160deg,#ffffff,#f0edff); display:flex; align-items:center; justify-content:center; margin:0 auto 6px; box-shadow:0 4px 10px rgba(92,68,220,.14);}
.emoji-badge img{filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));}
.emoji-badge.small{width:40px; height:40px; border-radius:12px; margin:0;}
.inv-row{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:var(--surface-soft); margin-bottom:8px;}

/* fullscreen sandbox */
.fs-overlay{position:fixed; inset:0; background:var(--bg); z-index:999; overflow-y:auto; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);}
.fs-header{position:sticky; top:0; background:var(--surface); padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); z-index:2;}
.fs-body{padding:16px; max-width:560px; width:100%; margin:0 auto; flex:1;}
.preset-card{background:var(--surface); border-radius:18px; padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-sm);}
.preset-card .pi{font-size:30px; flex-shrink:0;}
.rules-summary{background:var(--surface-soft); border-left:4px solid var(--primary); border-radius:12px; padding:14px; font-size:13px; line-height:1.6;}

/* memory */
.memory-grid{display:grid; gap:8px;}
.memory-card{aspect-ratio:1; border-radius:12px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:min(26px,6vw); cursor:pointer;}
.memory-card.flipped, .memory-card.matched{background:var(--surface-soft);}
.memory-card.matched{opacity:.35;}

/* whack */
.whack-grid{display:grid; gap:10px; touch-action:manipulation;}
.whack-hole{aspect-ratio:1; border-radius:50%; background:var(--surface-soft); display:flex; align-items:center; justify-content:center; font-size:min(30px,7vw); box-shadow:inset 0 4px 10px rgba(0,0,0,.08);}

/* colormatch */
.color-swatch-btn{border-radius:16px; border:none;}

/* dodge */
.dodge-lanes{display:flex; gap:8px; height:min(340px,50vh); position:relative; background:#dff0ff; border-radius:18px; overflow:hidden; touch-action:manipulation;}
.dodge-lane{flex:1; position:relative;}
.dodge-player{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:30px;}
.dodge-obj{position:absolute; left:50%; transform:translateX(-50%); font-size:26px;}

/* simon */
.simon-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(220px,68vw); margin:0 auto;}
.simon-pad{aspect-ratio:1; border-radius:16px; border:none; opacity:.55; transition:opacity .1s, transform .1s;}
.simon-pad.lit{opacity:1; transform:scale(0.94);}

/* rhythm */
.rhythm-wrap{position:relative; width:min(200px,60vw); height:min(200px,60vw); margin:20px auto;}
.rhythm-target{position:absolute; inset:0; border-radius:50%; border:4px solid var(--line);}
.rhythm-ring{position:absolute; inset:0; border-radius:50%; border:4px solid var(--primary);}

@media(max-width:370px){
  .actions-grid{gap:5px;}
  .action-btn{font-size:9.5px; padding:9px 1px;}
  .action-btn i{font-size:16px;}
  .nav-btn{font-size:9.5px;}
  .nav-btn i{font-size:16px;}
  .topbar .title{font-size:18px;}
  .coin-pill{font-size:11px; padding:5px 8px;}
  .pet-emoji{font-size:min(74px,22vw);}
}
</style>
</head>

let actx=null;
function ac(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
function tone(freq,dur=0.15,type="sine",vol=0.18,delay=0){
  try{
    const c=ac(); const o=c.createOscillator(); const g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=0; o.connect(g); g.connect(c.destination);
    const t0=c.currentTime+delay;
    g.gain.linearRampToValueAtTime(vol,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}

function newPet(name){
  return {
    name: name||"Otama", hunger:80, happiness:80, energy:80, hygiene:80, thirst:80,
    ageMinutes:0, coins:25, level:1, exp:0, sleeping:false, equippedSkin:null,

  };
}
function stageFor(ageMinutes){
  let s=STAGE_INFO[0];
  for(const st of STAGE_INFO){ if(ageMinutes>=st.min) s=st; }
  return s;
}
function petEmojiFor(profile){
  const p=profile.pet;
  if(p.equippedSkin) return null;
  const stage=stageFor(p.ageMinutes);
  if(stage.emo) return stage.emo;
  return profile.avatar || "🐣";
}
function expForLevel(l){ return 30+(l||1)*25; }
function addExp(amount){
  const pet=PROFILE.pet;
  pet.exp=(pet.exp||0)+Math.max(0,amount);
  let leveled=false;
  while(pet.exp>=expForLevel(pet.level||1)){
    pet.exp-=expForLevel(pet.level||1);
    pet.level=(pet.level||1)+1;
    pet.coins=(pet.coins||0)+8;
    leveled=true;
  }
  if(leveled){ SND.success(); toast("Livello "+pet.level+" raggiunto! 🎉","ok"); }
}
function cuddleRemaining(){
  const last=PROFILE.pet.lastCuddle||0;
  const rem=15*60000-(Date.now()-last);
  return rem>0?rem:0;
}
function applyDecay(pet){
  const now=Date.now();
  const elapsedMin = Math.max(0,(now-(pet.lastUpdate||now))/60000);
  if(pet.thirst===undefined) pet.thirst=80;
  if(pet.level===undefined) pet.level=1;
  if(pet.exp===undefined) pet.exp=0;
  if(!pet.inventory) pet.inventory={food:{},drink:{}};
  if(elapsedMin<=0) return pet;
  if(!pet.sleeping){
    pet.hunger = clamp(pet.hunger - elapsedMin*1.1, 0, 100);
    pet.thirst = clamp(pet.thirst - elapsedMin*1.3, 0, 100);
    pet.happiness = clamp(pet.happiness - elapsedMin*0.8, 0, 100);
    pet.hygiene = clamp(pet.hygiene - elapsedMin*0.6, 0, 100);
    pet.energy = clamp(pet.energy - elapsedMin*0.7, 0, 100);
    pet.ageMinutes = (pet.ageMinutes||0) + elapsedMin;
  } else {
    pet.energy = clamp(pet.energy + elapsedMin*2.2, 0, 100);
    pet.hunger = clamp(pet.hunger - elapsedMin*0.3, 0, 100);
    pet.thirst = clamp(pet.thirst - elapsedMin*0.3, 0, 100);
  }
  pet.lastUpdate = now;
  return pet;
}

function renderPixelSpanFromGrid(grid,size){

function floatEmote(container, emoji){
  const stage=$("#petStage"); if(!stage) return;

    const f=el(`<div class="float-emote" style="left:${40+Math.random()*20}%; top:${30+Math.random()*10}%;">${emoji}</div>`);

async function doAction(type){
  const pet=PROFILE.pet;
  if(type==="clean"){
    pet.hygiene=clamp(pet.hygiene+30,0,100); pet.happiness=clamp(pet.happiness+1,0,100);
    SND.clean(); floatEmote(null,"✨"); toast("Ora è pulitissimo!","ok");
  } else if(type==="sleep"){
    pet.sleeping=!pet.sleeping;
    SND.sleep(); toast(pet.sleeping?"Buonanotte 🌙":"Sveglio e riposato!","ok");
  } else if(type==="cuddle"){
    if(pet.sleeping) return toast("Sta dormendo, lascialo riposare 💤","err");
    if(cuddleRemaining()>0) return toast("Coccole disponibili tra "+fmtMin(cuddleRemaining()),"err");
    pet.lastCuddle=Date.now(); pet.coins=(pet.coins||0)+2;
    addExp(3);
    SND.play(); floatEmote(null,"💞"); toast(esc(pet.name)+" adora le coccole!","ok");
  }
  pet.lastUpdate=Date.now();
  await savePet();
  render();

function openConsumeSheet(kind){
  const inv=(PROFILE.pet.inventory&&PROFILE.pet.inventory[kind])||{};
  const catalog = kind==="food"?SHOP_FOOD:SHOP_DRINKS;
  const owned = Object.entries(inv).filter(([id,n])=>n>0).map(([id,n])=>{ const it=catalog.find(i=>i.id===id); return it?{...it,count:n}:null; }).filter(Boolean);
  if(!owned.length){
    openSheet(`
      <h3 class="center" style="margin-bottom:10px;">${kind==='food'?'Nessun cibo disponibile':'Nessuna bevanda disponibile'}</h3>
      <p class="muted center">Vai al Negozio (scheda Market) per comprarne!</p>
      <button class="btn btn-primary btn-block" id="goShop">Vai al Negozio</button>`);
    $("#goShop").onclick=()=>{ closeSheet(); navigate("market", {marketTab:"shop"}); };
    return;
  }
  openSheet(`<h3 class="center" style="margin-bottom:12px;">${kind==='food'?'Scegli cosa mangiare':'Scegli cosa bere'}</h3>` +
    owned.map(it=>`
      <div class="inv-row">
        ${emojiBadge(it.emoji,30,true)}
        <div style="flex:1;"><b>${esc(it.name)}</b><div class="muted" style="font-size:12px;">Possiedi: ${it.count}</div></div>
        <button class="btn btn-primary btn-sm" data-use="${it.id}">Usa</button>
      </div>`).join(""));
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>consumeItem(kind,b.dataset.use));
}
async function consumeItem(kind,itemId){
  const catalog= kind==="food"?SHOP_FOOD:SHOP_DRINKS;
  const item=catalog.find(i=>i.id===itemId); if(!item) return;
  const pet=PROFILE.pet;
  pet.inventory=pet.inventory||{food:{},drink:{}};
  const cur=pet.inventory[kind][itemId]||0;
  if(cur<=0) return;
  pet.inventory[kind][itemId]=cur-1;
  if(kind==="food") pet.hunger=clamp(pet.hunger+item.restore,0,100);
  else pet.thirst=clamp(pet.thirst+item.restore,0,100);
  pet.happiness=clamp(pet.happiness+(item.happiness||0),0,100);
  addExp(2);
  pet.lastUpdate=Date.now();
  const ok=await savePet();
  if(ok){ SND.feed(); floatEmote(null, item.emoji); toast(esc(pet.name)+" ha consumato "+item.name,"ok"); }
  closeSheet(); render();
}

async function renderArcade(){

async function submitMinigame(title,mechanic,config,existingId){
  const isOfficial=!!PROFILE.isAdmin;
  const ok = await safeWrite(async ()=>{
    if(existingId){
      await updateDoc(doc(db,"minigames",existingId),{title,type:mechanic,config,official:isOfficial});
    } else {
      await addDoc(collection(db,"minigames"),{
        title, type:mechanic, config, authorId:CURRENT_USER.uid, authorName:PROFILE.username,
        official:isOfficial, createdAt:Date.now(), plays:0
      });

/* ---- Sandbox full-screen builder ---- */
function openSandboxBuilder(options){
  const ov=el(`<div class="fs-overlay" id="sandboxOverlay">
    <div class="fs-header">
      <button class="icon-btn" id="fsBack"><i class="fa-solid fa-arrow-left"></i></button>
      <h3 style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Sandbox Creator</h3>
    </div>
    <div class="fs-body" id="fsBody"></div>
  </div>`);
  document.body.appendChild(ov);
  $("#fsBack").onclick=()=>{ ov.remove(); };
  if(options && options.editGame){
    const g=options.editGame;
    const preset = PRESETS.find(p=>p.mechanic===g.type) || {mechanic:g.type, name:g.title, desc:"", icon:GAME_ICONS[g.type]||"🎮"};
    TEMP.sandboxTitle=g.title; TEMP.editingGameId=g.id;
    if(g.type==="quiz"){
      TEMP.quizQuestions = JSON.parse(JSON.stringify(g.config.questions||[{q:"",opts:["","","",""],correct:0}]));
      TEMP.quizTitle=g.title;
    } else {
      TEMP.sandboxConfig = {...g.config};
    }
    renderSandboxForm(preset);
  } else {
    renderPresetPicker();
  }
}
function renderPresetPicker(){
  const body=$("#fsBody");
  body.innerHTML=`<p class="muted" style="margin-bottom:14px;">Scegli un modello di partenza: potrai modificare tutte le regole prima di pubblicare.</p>` +
    PRESETS.map((p,i)=>`<div class="preset-card" data-preset="${i}" style="cursor:pointer;"><div class="pi">${p.icon}</div><div><b>${esc(p.name)}</b><div class="muted" style="font-size:12px;">${esc(p.desc)}</div></div></div>`).join("");
  body.querySelectorAll("[data-preset]").forEach(c=>c.onclick=()=>{
    const p=PRESETS[+c.dataset.preset];
    TEMP.sandboxTitle=p.name; TEMP.editingGameId=null;
    if(p.mechanic==="quiz"){ TEMP.quizQuestions=[{q:"",opts:["","","",""],correct:0}]; TEMP.quizTitle=""; }
    else { TEMP.sandboxConfig={}; (MECH_SCHEMAS[p.mechanic]||[]).forEach(f=>TEMP.sandboxConfig[f.key]=f.default); }
    renderSandboxForm(p);
  });
}
function renderSandboxForm(preset){
  const body=$("#fsBody");
  if(preset.mechanic==="quiz"){

    ${schema.map(f=>`
      <div class="field"><label>${esc(f.label)}</label>
        <input data-fk="${f.key}" type="${f.type==='number'?'number':'text'}" value="${esc(TEMP.sandboxConfig[f.key])}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''}>

    <div class="section-title">Anteprima live</div>
    <div class="card" id="livePreview" style="padding:16px;"></div>

    <button class="btn btn-primary btn-block" id="publishSandbox" style="margin-top:16px;"><i class="fa-solid fa-cloud-arrow-up"></i> ${TEMP.editingGameId?'Salva modifiche':'Pubblica minigioco'}</button>`;

  function syncSummary(){

  }
  body.querySelectorAll("[data-fk]").forEach(inp=>inp.oninput=()=>{
    const f=schema.find(x=>x.key===inp.dataset.fk);
    TEMP.sandboxConfig[f.key]= f.type==="number" ? (+inp.value||f.default) : inp.value;
    syncSummary();
  });
  $("#sb_title").oninput=syncSummary;
  syncSummary();
  $("#publishSandbox").onclick=async ()=>{
    const title=$("#sb_title").value.trim();
    if(!title) return toast("Dai un titolo al tuo gioco","err");

}
function buildRulesSummary(mechanic,cfg,title){
  const base=`<b>${esc(title)}</b><br>Durata: ${cfg.duration||'-'}s`;
  switch(mechanic){
    case "catch": return base+`<br>Obiettivo: colpisci ${esc(cfg.target)} evitando ${esc(cfg.decoy)}<br>Punteggio richiesto: ${cfg.winScore}<br>Velocità: un bersaglio ogni ${cfg.spawn}ms`;
    case "memory": return `<b>${esc(title)}</b><br>Trova ${cfg.pairs} coppie entro ${cfg.duration}s`;
    case "whack": return base+`<br>Colpisci ${esc(cfg.target)} in ${cfg.holes} buche<br>Comparsa ogni ${cfg.popSpeed}ms · Punteggio richiesto: ${cfg.winScore}`;
    case "colormatch": return base+`<br>Tocca il colore corretto · Punteggio richiesto: ${cfg.winScore}`;
    case "math": return base+`<br>Numeri fino a ${cfg.maxNumber} · Risposte corrette richieste: ${cfg.winScore}`;
    case "dodge": return base+`<br>${cfg.lanes} corsie · Massimo ${cfg.maxHits} colpi subiti`;
    case "simon": return `<b>${esc(title)}</b><br>Ripeti la sequenza fino a lunghezza ${cfg.winLength} (velocità ${cfg.speed}ms)`;
    case "typing": return base+`<br>Parole corrette richieste: ${cfg.winScore}`;
    case "rhythm": return base+`<br>Colpi precisi richiesti: ${cfg.winScore} (ciclo ${cfg.speed}ms)`;
    default: return base;
  }
}
function buildLivePreview(mechanic,cfg){
  switch(mechanic){
    case "catch":
      return `<div style="position:relative; height:130px; background:#cfe8ff; border-radius:14px; overflow:hidden;">
        <div style="position:absolute; left:28%; top:32%; font-size:32px; animation:bob 1.6s ease-in-out infinite;">${esc(cfg.target||'⭐')}</div>
        <div style="position:absolute; left:66%; top:58%; font-size:32px; animation:bob 1.4s ease-in-out infinite;">${esc(cfg.decoy||'💣')}</div>
      </div>`;
    case "whack":{
      const holes=clamp(cfg.holes||9,4,9); const cols=holes<=4?2:3;
      return `<div class="whack-grid" style="grid-template-columns:repeat(${cols},1fr);">${Array.from({length:holes}).map((_,i)=>`<div class="whack-hole" style="height:44px; font-size:22px;">${i===1?esc(cfg.target||'🐹'):''}</div>`).join("")}</div>`;
    }
    case "memory":{
      const n=Math.min(6,cfg.pairs||6);
      return `<div class="memory-grid" style="grid-template-columns:repeat(${Math.min(4,n)},1fr);">${Array.from({length:n}).map(()=>`<div class="memory-card" style="height:38px;"></div>`).join("")}</div>`;
    }
    case "colormatch":
      return `<div class="center" style="font-weight:800; margin-bottom:10px;">Tocca: Rosso</div><div style="display:flex; gap:8px; justify-content:center;">${COLOR_POOL.slice(0,4).map(c=>`<div style="width:38px; height:38px; border-radius:10px; background:${c.h};"></div>`).join("")}</div>`;
    case "math":
      return `<div class="center" style="font-size:24px; font-weight:800;">${1+Math.floor((cfg.maxNumber||20)/3)} + ${1+Math.floor((cfg.maxNumber||20)/4)} = ?</div>`;
    case "dodge":{
      const lanes=clamp(cfg.lanes||3,2,4);
      return `<div style="display:flex; gap:6px; height:96px;">${Array.from({length:lanes}).map((_,i)=>`<div style="flex:1; background:#dff0ff; border-radius:8px; position:relative;">${i===1?'<div style="position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:22px;">☄️</div>':''}${i===Math.floor(lanes/2)?'<div style="position:absolute; bottom:4px; left:50%; transform:translateX(-50%); font-size:22px;">🙂</div>':''}</div>`).join("")}</div>`;
    }
    case "simon":
      return `<div class="simon-grid" style="width:120px;">${SIMON_COLORS.map(c=>`<div style="aspect-ratio:1; background:${c}; border-radius:10px; opacity:.8;"></div>`).join("")}</div>`;
    case "typing":
      return `<div class="center" style="font-size:22px; font-weight:800; letter-spacing:1px;">${esc((cfg.words||'gatto').split(",")[0].trim()||'parola')}</div>`;
    case "rhythm":
      return `<div class="rhythm-wrap" style="width:100px; height:100px; margin:6px auto;"><div class="rhythm-target"></div><div class="rhythm-ring" style="transform:scale(1.3);"></div></div>`;
    default: return `<p class="muted center">Nessuna anteprima disponibile</p>`;
  }
}
function renderQuizBuilderInto(holder){
  const qs=TEMP.quizQuestions;
  holder.innerHTML=`
    <div class="field"><label>Titolo del quiz</label><input id="g_title" value="${esc(TEMP.quizTitle||'')}" placeholder="es. Quiz sugli animali"></div>
    <div id="qList"></div>

    <button class="btn btn-primary btn-block" id="submitQuiz"><i class="fa-solid fa-paper-plane"></i> ${TEMP.editingGameId?'Salva modifiche':'Pubblica quiz'}</button>`;
  const qList=$("#qList");
  function redrawQ(){
    qList.innerHTML = qs.map((qq,i)=>`
      <div class="card">
        <div class="field"><label>Domanda ${i+1}</label><input data-qi="${i}" class="qtext" value="${esc(qq.q)}" placeholder="Scrivi la domanda"></div>
        ${qq.opts.map((o,oi)=>`
          <div class="row field">
            <input data-qi="${i}" data-oi="${oi}" class="qopt" value="${esc(o)}" placeholder="Opzione ${oi+1}">
            <label style="display:flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto;">
              <input type="radio" name="correct${i}" data-qi="${i}" data-oi="${oi}" class="qcorrect" ${qq.correct===oi?'checked':''} style="width:18px;">Giusta
            </label>
          </div>`).join("")}
        ${qs.length>1?`<button class="btn btn-danger btn-sm" data-delq="${i}"><i class="fa-solid fa-trash"></i> Rimuovi domanda</button>`:``}
      </div>`).join("");
    qList.querySelectorAll(".qtext").forEach(inp=>inp.oninput=()=>{qs[+inp.dataset.qi].q=inp.value;});
    qList.querySelectorAll(".qopt").forEach(inp=>inp.oninput=()=>{qs[+inp.dataset.qi].opts[+inp.dataset.oi]=inp.value;});
    qList.querySelectorAll(".qcorrect").forEach(inp=>inp.onchange=()=>{qs[+inp.dataset.qi].correct=+inp.dataset.oi;});
    qList.querySelectorAll("[data-delq]").forEach(b=>b.onclick=()=>{qs.splice(+b.dataset.delq,1); redrawQ();});
  }
  redrawQ();
  $("#addQ").onclick=()=>{qs.push({q:"",opts:["","","",""],correct:0}); redrawQ();};
  $("#submitQuiz").onclick=async ()=>{
    const title=holder.querySelector("#g_title").value.trim(); TEMP.quizTitle=title;
    if(!title) return toast("Dai un titolo al quiz","err");
    for(const qq of qs){ if(!qq.q.trim()||qq.opts.some(o=>!o.trim())) return toast("Completa tutte le domande e opzioni","err"); }
    await submitMinigame(title,"quiz",{questions:qs}, TEMP.editingGameId);
    document.getElementById("sandboxOverlay")?.remove();
  };
}

/* ---- Play dispatcher ---- */
function renderPlayGame(){
  const g=TEMP.playGameData;
  if(!g){ toast("Apri il gioco dall'Arcade","err"); navigate("arcade"); return; }
  const map={
    catch:renderPlayReflex, quiz:renderPlayQuiz, memory:renderPlayMemory, whack:renderPlayWhack,
    colormatch:renderPlayColorMatch, math:renderPlayMath, dodge:renderPlayDodge, simon:renderPlaySimon,
    typing:renderPlayTyping, rhythm:renderPlayRhythm
  };
  (map[g.type]||renderPlayReflex)(g);
}
async function finishSandboxGame(game, rawScore, won, label){
  const coinsEarned=Math.max(1, Math.round(rawScore*0.7 + (won?6:0)));
  const expEarned=Math.max(1, Math.round(rawScore*0.5 + (won?5:2)));
  PROFILE.pet.coins=(PROFILE.pet.coins||0)+coinsEarned;
  PROFILE.pet.happiness=clamp(PROFILE.pet.happiness+(won?14:7),0,100);
  addExp(expEarned);
  await savePet();
  try{ await updateDoc(doc(db,"minigames",game.id),{plays:increment(1)}); }catch(e){ console.error(e); }
  SND.success();
  $("#screen").innerHTML=`<div class="card center">
    <div style="font-size:40px;">${won?'🏆':'🙂'}</div>
    <h3>${won?'Hai vinto!':'Bel tentativo!'}</h3>
    <p class="muted">${label} · Monete: +${coinsEarned} · EXP: +${expEarned}</p>
    <button class="btn btn-primary btn-block" id="backArcade">Torna all'Arcade</button></div>`;
  $("#backArcade").onclick=()=>navigate("arcade");
}
function renderPlayReflex(g){
  const c=g.config;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>
    <p class="muted center">Tocca ${esc(c.target)} ed evita ${esc(c.decoy)}! Tempo: <span id="timeLeft">${c.duration}</span>s</p>
    <div class="reflex-arena" id="arena"></div>`;
  $("#back").onclick=()=>{stopReflex(); navigate("arcade");};
  let score=0, timeLeft=c.duration, spawnTimer=null, countTimer=null, running=true;
  const arena=$("#arena");
  function spawnTarget(){
    if(!running) return;
    const isDecoy = Math.random()<0.35;
    const t=el(`<button class="reflex-target">${isDecoy?c.decoy:c.target}</button>`);
    const x=10+Math.random()*80, y=10+Math.random()*80;
    t.style.left=x+"%"; t.style.top=y+"%";
    t.onclick=()=>{
      if(!running) return;
      if(isDecoy){ score=Math.max(0,score-2); SND.error(); shakeArena(); }
      else { score++; SND.coin(); }
      $("#scoreVal").textContent=score;
      t.remove();
    };
    arena.appendChild(t);
    setTimeout(()=>t.remove(), Math.max(500,c.spawn*1.4));
  }
  function shakeArena(){ arena.style.animation="shake .3s"; setTimeout(()=>arena.style.animation="",300); }
  spawnTimer=setInterval(spawnTarget, c.spawn);
  countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
  function stopReflex(){ running=false; clearInterval(spawnTimer); clearInterval(countTimer); }
  function endGame(){ stopReflex(); finishSandboxGame(g, score, score>=c.winScore, `Punteggio: ${score}`); }
}
function renderPlayQuiz(g){
  const questions=g.config.questions;
  TEMP.quizIndex=0; TEMP.quizScore=0;
  function showQ(){
    const i=TEMP.quizIndex;
    if(i>=questions.length) return finishQuiz();
    const q=questions[i];
    $("#screen").innerHTML=`
      <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
        <div class="coin-pill">${i+1}/${questions.length}</div></div>
      <div class="card"><h3 style="margin-bottom:14px;">${esc(q.q)}</h3>
        ${q.opts.map((o,oi)=>`<button class="quiz-opt" data-oi="${oi}">${esc(o)}</button>`).join("")}
      </div>`;
    $("#back").onclick=()=>navigate("arcade");
    $("#screen").querySelectorAll(".quiz-opt").forEach(b=>b.onclick=()=>{
      $("#screen").querySelectorAll(".quiz-opt").forEach(x=>x.disabled=true);
      const oi=+b.dataset.oi;
      if(oi===q.correct){ b.classList.add("correct"); TEMP.quizScore++; SND.coin(); }
      else { b.classList.add("wrong"); SND.error(); $("#screen").querySelectorAll(".quiz-opt")[q.correct].classList.add("correct"); }
      setTimeout(()=>{ TEMP.quizIndex++; showQ(); },900);
    });
  }
  function finishQuiz(){
    const pct = questions.length? TEMP.quizScore/questions.length : 0;
    finishSandboxGame(g, TEMP.quizScore*3, pct>=0.6, `Risposte corrette: ${TEMP.quizScore}/${questions.length}`);
  }
  showQ();
}
function renderPlayMemory(g){
  const c=g.config; const pairsN=clamp(c.pairs||6,3,10);
  const pool=["🍎","🍌","🍇","🍓","🍒","🍉","🥝","🍑","🍍","🥥","🍋","🍊"];
  let deck=[]; for(let i=0;i<pairsN;i++){deck.push(pool[i],pool[i]);}
  deck=deck.sort(()=>Math.random()-0.5);
  let matched=0, first=null, lock=false, timeLeft=c.duration||60;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill">⏱ <span id="timeLeft">${timeLeft}</span>s</div></div>
    <div class="memory-grid" id="mgrid" style="grid-template-columns:repeat(${Math.min(4,Math.ceil(Math.sqrt(deck.length)))},1fr);"></div>`;
  $("#back").onclick=()=>{clearInterval(timer); navigate("arcade");};
  const grid=$("#mgrid");
  grid.innerHTML=deck.map((e,i)=>`<div class="memory-card" data-i="${i}" data-e="${e}"></div>`).join("");
  const cards=[...grid.children];
  cards.forEach(card=>card.onclick=()=>{
    if(lock||card.classList.contains("flipped")||card.classList.contains("matched")) return;
    card.textContent=card.dataset.e; card.classList.add("flipped"); SND.click();
    if(!first){ first=card; return; }
    lock=true;
    if(first.dataset.e===card.dataset.e){
      first.classList.add("matched"); card.classList.add("matched"); matched++;
      SND.coin(); first=null; lock=false;
      if(matched===pairsN) endMemory(true);
    } else {
      setTimeout(()=>{ first.textContent=''; first.classList.remove("flipped"); card.textContent=''; card.classList.remove("flipped"); first=null; lock=false; },700);
    }
  });
  const timer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0) endMemory(false);
  },1000);
  function endMemory(won){ clearInterval(timer); finishSandboxGame(g, matched*3, won, `Coppie trovate: ${matched}/${pairsN}`); }
}
function renderPlayWhack(g){
  const c=g.config; const holes=clamp(c.holes||9,4,9); const cols=holes<=4?2:3;
  let score=0, timeLeft=c.duration||30, active=-1, popTimer=null, countTimer=null, running=true;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>
    <p class="muted center">Colpisci ${esc(c.target||'🐹')}! Tempo: <span id="timeLeft">${timeLeft}</span>s</p>
    <div class="whack-grid" id="wgrid" style="grid-template-columns:repeat(${cols},1fr);"></div>`;
  $("#back").onclick=()=>{stop(); navigate("arcade");};
  const grid=$("#wgrid");
  grid.innerHTML=Array.from({length:holes}).map((_,i)=>`<div class="whack-hole" data-i="${i}"></div>`).join("");
  const cells=[...grid.children];
  cells.forEach(cell=>cell.onclick=()=>{
    if(+cell.dataset.i===active && running){
      score++; SND.coin(); cell.textContent=''; active=-1; $("#scoreVal").textContent=score;
    }
  });
  function pop(){
    if(!running) return;
    if(active>=0) cells[active].textContent='';
    active=Math.floor(Math.random()*holes);
    cells[active].textContent=c.target||'🐹';
    setTimeout(()=>{ if(cells[active]) cells[active].textContent=''; },Math.max(300,(c.popSpeed||900)*0.8));
  }
  popTimer=setInterval(pop, c.popSpeed||900);
  countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0) end();
  },1000);
  function stop(){ running=false; clearInterval(popTimer); clearInterval(countTimer); }
  function end(){ stop(); finishSandboxGame(g, score, score>=(c.winScore||12), `Punteggio: ${score}`); }
}
function renderPlayColorMatch(g){
  const c=g.config;
  let score=0, timeLeft=c.duration||30, running=true;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>

  function round(){
    const target=COLOR_POOL[Math.floor(Math.random()*COLOR_POOL.length)];
    let others=COLOR_POOL.filter(x=>x.n!==target.n).sort(()=>Math.random()-0.5).slice(0,3);

    $("#swatches").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
      if(!running) return;
      if(b.dataset.n===target.n){ score++; SND.coin(); } else { SND.error(); }
      $("#scoreVal").textContent=score;
      round();
    });
  }
  round();
  const countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0){ running=false; clearInterval(countTimer); finishSandboxGame(g, score, score>=(c.winScore||10), `Punteggio: ${score}`); }

function renderPlayMath(g){
  const c=g.config; const maxN=c.maxNumber||20;
  let score=0, timeLeft=c.duration||40, running=true;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>
    <p class="muted center">Tempo: <span id="timeLeft">${timeLeft}</span>s</p>
    <div class="card center"><h2 id="mathQ" style="font-size:30px;"></h2></div>
    <div class="grid2" id="mathOpts"></div>`;
  $("#back").onclick=()=>{running=false; clearInterval(countTimer); navigate("arcade");};
  function round(){
    const a=1+Math.floor(Math.random()*maxN), b=1+Math.floor(Math.random()*maxN);
    const op=Math.random()<0.5?'+':'-';
    const correct= op==='+'? a+b : a-b;
    $("#mathQ").textContent=`${a} ${op} ${b} = ?`;
    let opts=new Set([correct]);
    while(opts.size<4) opts.add(correct + (Math.floor(Math.random()*11)-5));
    const arr=[...opts].sort(()=>Math.random()-0.5);
    $("#mathOpts").innerHTML=arr.map(v=>`<button class="btn btn-soft" data-v="${v}">${v}</button>`).join("");
    $("#mathOpts").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
      if(!running) return;
      if(+b.dataset.v===correct){ score++; SND.coin(); } else { SND.error(); }
      $("#scoreVal").textContent=score;
      round();
    });
  }
  round();
  const countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0){ running=false; clearInterval(countTimer); finishSandboxGame(g, score, score>=(c.winScore||8), `Risposte corrette: ${score}`); }
  },1000);
}
function renderPlayTyping(g){
  const c=g.config; const words=(c.words||"gatto,cane,sole").split(",").map(w=>w.trim()).filter(Boolean);
  let score=0, timeLeft=c.duration||40, running=true, current='';
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>
    <p class="muted center">Tempo: <span id="timeLeft">${timeLeft}</span>s</p>
    <div class="card center"><h2 id="wordShow" style="font-size:28px; letter-spacing:2px;"></h2></div>
    <div class="field"><input id="typeInput" placeholder="Scrivi qui e premi Invio" autocomplete="off"></div>`;
  $("#back").onclick=()=>{running=false; clearInterval(countTimer); navigate("arcade");};
  function nextWord(){ current=words[Math.floor(Math.random()*words.length)]; $("#wordShow").textContent=current; $("#typeInput").value=''; }
  nextWord();

      $("#scoreVal").textContent=score;
      nextWord();

  };
  const countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0){ running=false; clearInterval(countTimer); finishSandboxGame(g, score, score>=(c.winScore||8), `Parole corrette: ${score}`); }
  },1000);
}
function renderPlayDodge(g){
  const c=g.config; const lanes=clamp(c.lanes||3,2,4);
  let playerLane=Math.floor(lanes/2), hits=0, timeLeft=c.duration||30, running=true, spawnTimer=null, countTimer=null, moveTimer=null;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill">💥 <span id="hitsVal">0</span>/${c.maxHits??3}</div></div>
    <p class="muted center">Tocca una corsia per spostarti! Tempo: <span id="timeLeft">${timeLeft}</span>s</p>
    <div class="dodge-lanes" id="lanes"></div>`;
  $("#back").onclick=()=>{stop(); navigate("arcade");};
  const laneEls=[];
  const wrap=$("#lanes");
  for(let i=0;i<lanes;i++){
    const laneDiv=el(`<div class="dodge-lane" data-lane="${i}"></div>`);
    laneDiv.onclick=()=>{ playerLane=i; renderPlayer(); };
    wrap.appendChild(laneDiv); laneEls.push(laneDiv);
  }
  function renderPlayer(){
    laneEls.forEach((l,i)=>{ let p=l.querySelector(".dodge-player"); if(i===playerLane){ if(!p){ p=el('<div class="dodge-player">🙂</div>'); l.appendChild(p);} } else if(p){ p.remove(); } });
  }
  renderPlayer();
  const obstacles=[];
  function spawnObstacle(){
    if(!running) return;
    const lane=Math.floor(Math.random()*lanes);
    const o=el('<div class="dodge-obj">☄️</div>'); o.style.top='0%';
    laneEls[lane].appendChild(o);
    obstacles.push({el:o, lane, top:0});
  }
  spawnTimer=setInterval(spawnObstacle, c.spawnSpeed||700);
  moveTimer=setInterval(()=>{
    for(let i=obstacles.length-1;i>=0;i--){
      const ob=obstacles[i]; ob.top+=8; ob.el.style.top=ob.top+"%";
      if(ob.top>=88){
        if(ob.lane===playerLane){
          hits++; $("#hitsVal").textContent=hits; SND.error();
          if(hits>(c.maxHits??3)){ ob.el.remove(); obstacles.splice(i,1); end(false); continue; }
        }
        ob.el.remove(); obstacles.splice(i,1);
      }
    }
  },90);
  countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0) end(true);
  },1000);
  function stop(){ running=false; clearInterval(spawnTimer); clearInterval(countTimer); clearInterval(moveTimer); }
  function end(won){ if(!running) return; stop(); const score=Math.max(0, 20-hits*3); finishSandboxGame(g, score, won, `Colpi subiti: ${hits}`); }
}
function renderPlaySimon(g){
  const c=g.config;
  let sequence=[], userStep=0, running=true, accepting=false;
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill">🔢 <span id="lenVal">0</span></div></div>
    <p class="muted center" id="simonMsg">Guarda la sequenza…</p>
    <div class="simon-grid" id="sgrid"></div>`;
  $("#back").onclick=()=>{running=false; navigate("arcade");};
  $("#sgrid").innerHTML=SIMON_COLORS.map((cc,i)=>`<button class="simon-pad" data-i="${i}" style="background:${cc};"></button>`).join("");
  const pads=[...$("#sgrid").children];
  pads.forEach(p=>p.onclick=()=>{
    if(!accepting||!running) return;
    lightPad(+p.dataset.i);
    if(+p.dataset.i===sequence[userStep]){
      userStep++;
      if(userStep===sequence.length){
        accepting=false; $("#lenVal").textContent=sequence.length;
        if(sequence.length>=(c.winLength||8)) return end(true);
        setTimeout(nextRound,700);
      }
    } else { accepting=false; end(false); }
  });
  function lightPad(i){ pads[i].classList.add("lit"); SND.click(); setTimeout(()=>pads[i].classList.remove("lit"),250); }
  function nextRound(){
    sequence.push(Math.floor(Math.random()*4));
    userStep=0; accepting=false; $("#simonMsg").textContent="Guarda la sequenza…";
    let i=0;
    const t=setInterval(()=>{
      lightPad(sequence[i]); i++;
      if(i>=sequence.length){ clearInterval(t); accepting=true; $("#simonMsg").textContent="Tocca a te!"; }
    }, c.speed||600);
  }
  nextRound();
  function end(won){ if(!running) return; running=false; finishSandboxGame(g, sequence.length, won, `Sequenza raggiunta: ${sequence.length}`); }
}
function renderPlayRhythm(g){
  const c=g.config; const cycleMs=c.speed||1400;
  let score=0, timeLeft=c.duration||30, running=true, startT=performance.now();
  $("#screen").innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">${esc(g.title)}</div>
      <div class="coin-pill"><i class="fa-solid fa-star"></i> <span id="scoreVal">0</span></div></div>
    <p class="muted center">Tocca quando l'anello combacia! Tempo: <span id="timeLeft">${timeLeft}</span>s</p>
    <div class="rhythm-wrap"><div class="rhythm-target"></div><div class="rhythm-ring" id="ring"></div></div>
    <button class="btn btn-accent btn-block" id="tapBtn">TOCCA</button>`;
  $("#back").onclick=()=>{running=false; navigate("arcade");};
  function frame(now){
    if(!running) return;
    const phase=((now-startT)%cycleMs)/cycleMs;
    const scale=1+(1-phase)*0.9;
    const ring=$("#ring"); if(ring) ring.style.transform=`scale(${scale})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  $("#tapBtn").onclick=()=>{
    if(!running) return;
    const now=performance.now();
    const phase=((now-startT)%cycleMs)/cycleMs;
    const dist=Math.min(phase, 1-phase);
    if(dist<0.08){ score++; SND.coin(); } else { SND.error(); }
    $("#scoreVal").textContent=score;
  };
  const countTimer=setInterval(()=>{
    timeLeft--; const tl=$("#timeLeft"); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0){ running=false; clearInterval(countTimer); finishSandboxGame(g, score, score>=(c.winScore||10), `Colpi precisi: ${score}`); }
  },1000);
}

/* ================= PIXEL EDITOR ================= */
function renderPixelEditor(){
  TEMP.pixGrid = TEMP.pixGrid || Array(GRID_N*GRID_N).fill(null);
  TEMP.pixColor = TEMP.pixColor || PALETTE[0];
  const screen=$("#screen");
  screen.innerHTML=`
    <div class="topbar"><button class="icon-btn" id="back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">Editor pixel art</div><div style="width:40px;"></div></div>
    <div class="card center">
      <div class="pixel-grid" id="pgrid" style="width:min(260px,72vw); grid-template-columns:repeat(${GRID_N},1fr);"></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-soft" id="btnEraser"><i class="fa-solid fa-eraser"></i> Gomma</button>
      <button class="btn btn-danger" id="btnClear"><i class="fa-solid fa-trash"></i> Pulisci</button>
    </div>
    <div class="field"><label>Nome skin</label><input id="skinName" value="${esc(TEMP.editingSkinName||'')}" placeholder="es. Drago di fuoco"></div>
    <div class="row">
      <button class="btn btn-soft btn-block" id="btnApply"><i class="fa-solid fa-paw"></i> Applica al pet</button>
      <button class="btn btn-primary btn-block" id="btnPublish"><i class="fa-solid fa-cloud-arrow-up"></i> ${TEMP.editingSkinId?'Salva modifiche':'Pubblica'}</button>
    </div>`;
  $("#back").onclick=()=>navigate(TEMP.editingSkinId?"market":"home");
  const pgrid=$("#pgrid");
  pgrid.innerHTML = TEMP.pixGrid.map((c,i)=>`<div class="pixel-cell" data-i="${i}" style="${c?`background:${c};`:''}"></div>`).join("");
  function paint(i,erase){
    TEMP.pixGrid[i] = erase? null : TEMP.pixColor;
    if(!TEMP.pixGrid[i]) pgrid.children[i].removeAttribute("style");
    else pgrid.children[i].style.background = TEMP.pixGrid[i];
  }
  let painting=false, eraseMode=false;
  pgrid.addEventListener("pointerdown",e=>{ if(e.target.dataset.i!==undefined){painting=true; paint(+e.target.dataset.i, eraseMode); SND.click();} });
  pgrid.addEventListener("pointerover",e=>{ if(painting && e.target.dataset.i!==undefined) paint(+e.target.dataset.i, eraseMode); });
  window.addEventListener("pointerup",()=>painting=false);
  $("#palette").innerHTML = PALETTE.map(c=>`<div class="swatch ${c===TEMP.pixColor&&!eraseMode?'selected':''}" data-c="${c}" style="background:${c};"></div>`).join("");
  $("#palette").querySelectorAll(".swatch").forEach(s=>s.onclick=()=>{ TEMP.pixColor=s.dataset.c; eraseMode=false; render(); });

async function buyItem(kind,id){
  const catalog= kind==="food"?SHOP_FOOD:SHOP_DRINKS;
  const item=catalog.find(i=>i.id===id); if(!item) return;
  const pet=PROFILE.pet;
  if(!PROFILE.isAdmin && (pet.level||1)<item.minLevel) return toast("Livello troppo basso","err");
  if((pet.coins||0)<item.price) return toast("Monete insufficienti","err");
  pet.coins-=item.price;
  pet.inventory=pet.inventory||{food:{},drink:{}};
  pet.inventory[kind][id]=(pet.inventory[kind][id]||0)+1;
  const ok=await savePet();
  if(ok){ SND.coin(); toast(esc(item.name)+" acquistato!","ok"); }
  render();
}

function openGiftSheet(friendId, friendData){
  const inv=PROFILE.pet.inventory||{food:{},drink:{}};
  const owned=[];
  Object.entries(inv.food||{}).forEach(([id,n])=>{ if(n>0){ const it=SHOP_FOOD.find(x=>x.id===id); if(it) owned.push({...it,kind:"food",count:n}); }});
  Object.entries(inv.drink||{}).forEach(([id,n])=>{ if(n>0){ const it=SHOP_DRINKS.find(x=>x.id===id); if(it) owned.push({...it,kind:"drink",count:n}); }});
  if(!owned.length){
    openSheet(`<h3 class="center">Nessun oggetto da regalare</h3><p class="muted center">Compra cibo o bevande nel Negozio per poterli regalare.</p>`);
    return;
  }
  openSheet(`<h3 class="center" style="margin-bottom:12px;">Regala a ${esc(friendData.username)}</h3>` +
    owned.map(it=>`
      <div class="inv-row">
        ${emojiBadge(it.emoji,30,true)}

      </div>`).join(""));

async function sendGift(friendId,kind,itemId){
  const myPet=PROFILE.pet;
  const cur=myPet.inventory?.[kind]?.[itemId]||0;
  if(cur<=0) return;
  try{
    const friendSnap=await getDoc(doc(db,"users",friendId));
    if(!friendSnap.exists()) return toast("Utente non trovato","err");
    const fData=friendSnap.data(); const fPet=fData.pet||newPet();
    fPet.inventory=fPet.inventory||{food:{},drink:{}}; fPet.inventory[kind]=fPet.inventory[kind]||{};
    fPet.inventory[kind][itemId]=(fPet.inventory[kind][itemId]||0)+1;
    /* Aggiorna prima l'amico: solo se questo va a buon fine, tolgo l'oggetto a me */
    await updateDoc(doc(db,"users",friendId),{pet:fPet});
    myPet.inventory[kind][itemId]=cur-1;
    await savePet();
    SND.success(); toast("Regalo inviato! 🎁","ok"); closeSheet(); render();
  }catch(e){
    console.error(e);
    toast("Impossibile inviare il regalo — controlla le regole Firestore","err");
  }
}

async function doSearch(term){
  const box=$("#searchResults");
  const tl=usernameLower(term);
  if(tl.length<2){ box.innerHTML=`<p class="muted center">Scrivi almeno 2 lettere…</p>`; return; }
  box.innerHTML=`<div class="spinner"></div>`;
  try{
    const qy=query(collection(db,"users"), orderBy("usernameLower"), startAt(tl), endAt(tl+"\uf8ff"), limit(20));
    const snap=await getDocs(qy);
    const results=[];
    snap.forEach(d=>{ if(d.id!==CURRENT_USER.uid) results.push({id:d.id,...d.data()}); });
    const visible=results.filter(u=>u.privacy?.online!==false);
    if(!visible.length){ box.innerHTML=`<p class="muted center">Nessun utente trovato.</p>`; return; }
    box.innerHTML = visible.map(u=>{
      const isFriend=(PROFILE.friends||[]).includes(u.id);
      const sent=(PROFILE.outgoingRequests||[]).includes(u.id);
      return `<div class="list-item">
        <div class="av">${u.avatar||'🐣'}</div>
        <div class="meta"><div class="n">${esc(u.username)} ${u.isAdmin?'<span class="pill pill-admin">ADMIN</span>':''}</div><div class="s">${isFriend?'Già amici':''}</div></div>
        ${isFriend? `<span class="pill pill-approved">Amico</span>` :
          sent ? `<span class="pill pill-pending">Inviata</span>` :
          u.privacy?.friendRequests===false ? `<span class="muted" style="font-size:11px;">Non riceve richieste</span>` :
          `<button class="btn btn-soft btn-sm" data-req="${u.id}">Aggiungi</button>`}
      </div>`;
    }).join("");
    box.querySelectorAll("[data-req]").forEach(b=>b.onclick=()=>sendFriendRequest(b.dataset.req));
  }catch(e){
    console.error(e);
    box.innerHTML=`<p class="muted center">Errore nella ricerca. Controlla le regole Firestore.</p>`;
  }
}

function openChangePasswordSheet(){
  openSheet(`
    <h3 class="center" style="margin-bottom:14px;">Cambia password</h3>
    <div class="field"><label>Password attuale</label><input id="cp_old" type="password"></div>
    <div class="field"><label>Nuova password</label><input id="cp_new" type="password"></div>
    <div class="field"><label>Conferma nuova password</label><input id="cp_new2" type="password"></div>
    <button class="btn btn-primary btn-block" id="cp_submit">Conferma</button>`);
  $("#cp_submit").onclick=async ()=>{
    const oldP=$("#cp_old").value, np=$("#cp_new").value, np2=$("#cp_new2").value;
    if(np.length<6) return toast("La nuova password deve avere almeno 6 caratteri","err");
    if(isWeakPassword(np)) return toast("Password troppo banale, scegline una più sicura","err");
    if(np!==np2) return toast("Le nuove password non coincidono","err");
    try{
      const cred=EmailAuthProvider.credential(auth.currentUser.email, oldP);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, np);
      SND.success(); toast("Password aggiornata!","ok"); closeSheet();
    }catch(e){ SND.error(); toast("Password attuale errata","err"); }
  };
}
function openDeleteAccountSheet(){
  openSheet(`

  $("#del_submit").onclick=async ()=>{
    const pass=$("#del_pass").value;
    try{
      const cred=EmailAuthProvider.credential(auth.currentUser.email, pass);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await deleteDoc(doc(db,"users",CURRENT_USER.uid));
      await deleteUser(auth.currentUser);
      closeSheet(); toast("Account eliminato","ok");
    }catch(e){ SND.error(); toast("Password errata","err"); }

function renderAdminUsers(){
  getDocs(collection(db,"users")).then(snap=>{

    users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const box=$("#adminBody"); if(!box) return;
    box.innerHTML = users.map(u=>`
      <div class="list-item">
        <div class="av">${u.avatar||'🐣'}</div>
        <div class="meta"><div class="n">${esc(u.username)} ${u.isAdmin?'<span class="pill pill-admin">ADMIN</span>':''} ${u.banned?'<span class="pill pill-rejected">Bannato</span>':''}</div>

        ${u.id!==CURRENT_USER.uid ? `<button class="icon-btn" data-manage="${u.id}"><i class="fa-solid fa-sliders"></i></button>`:``}
      </div>`).join("");
    box.querySelectorAll("[data-manage]").forEach(b=>b.onclick=()=>openAdminUserSheet(users.find(x=>x.id===b.dataset.manage)));
  }).catch(e=>{
    console.error(e);
    const box=$("#adminBody"); if(box) box.innerHTML=`<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><br>Impossibile caricare gli utenti.</div>`;

function openAdminUserSheet(u){
  openSheet(`
    <h3 class="center">${esc(u.username)}</h3>

    <div class="divider"></div>
    <button class="btn btn-danger btn-block" id="am_delete"><i class="fa-solid fa-user-slash"></i> Elimina account</button>
  `);
  $("#am_toggleAdmin").onclick=async ()=>{ await adminSetRole(u.id,!u.isAdmin); closeSheet(); renderAdminUsers(); };
  $("#am_toggleBan").onclick=async ()=>{
    const ok=await safeWrite(async ()=>{ await updateDoc(doc(db,"users",u.id),{banned:!u.banned}); }, u.banned?"Utente riabilitato":"Utente bannato", "Impossibile aggiornare lo stato");
    if(ok){ SND.success(); closeSheet(); renderAdminUsers(); }
  };
  $("#am_logout").onclick=async ()=>{
    const ok=await safeWrite(async ()=>{ await updateDoc(doc(db,"users",u.id),{forceLogout:true}); }, "Richiesta di logout inviata", "Impossibile forzare il logout");
    if(ok) SND.success();
  };
  $("#am_delete").onclick=()=>adminDeleteAccountUI(u);
  const friends=u.friends||[];
  if(!friends.length){ $("#am_friends").innerHTML=`<p class="muted">Nessun amico.</p>`; }
  else {
    Promise.all(friends.map(fid=>getDoc(doc(db,"users",fid)))).then(docs=>{
      const items=docs.filter(d=>d.exists()).map(d=>({id:d.id,...d.data()}));
      const box=$("#am_friends"); if(!box) return;
      box.innerHTML = items.map(f=>`
        <div class="list-item">
          <div class="av">${f.avatar||'🐣'}</div>
          <div class="meta"><div class="n">${esc(f.username)}</div></div>
          <button class="btn btn-danger btn-sm" data-unfriend="${f.id}">Rimuovi</button>
        </div>`).join("");
      box.querySelectorAll("[data-unfriend]").forEach(b=>b.onclick=async ()=>{
        await adminRemoveFriendship(u.id,b.dataset.unfriend);
        u.friends=(u.friends||[]).filter(x=>x!==b.dataset.unfriend);
        openAdminUserSheet(u);
      });
    });
  }
}
async function adminSetRole(uid, makeAdmin){
  const ok=await safeWrite(async ()=>{ await updateDoc(doc(db,"users",uid),{isAdmin:makeAdmin}); }, makeAdmin?"Utente promosso Admin":"Privilegi Admin rimossi", "Impossibile modificare il ruolo");
  if(ok) SND.success();
}
async function adminRemoveFriendship(uidA,uidB){
  const ok=await safeWrite(async ()=>{
    await updateDoc(doc(db,"users",uidA),{friends:arrayRemove(uidB)});
    await updateDoc(doc(db,"users",uidB),{friends:arrayRemove(uidA)});
  }, "Amicizia rimossa", "Impossibile rimuovere l'amicizia");
  if(ok) SND.success();
}

  clearSubs();
  offlineRewardChecked=false;
  if(!user){ CURRENT_USER=null; PROFILE=null; VIEW="home"; render(); return; }
  CURRENT_USER=user;
  let first=true;
  const unsub = onSnapshot(doc(db,"users",user.uid), (snap)=>{
    if(!snap.exists()){
      if(CURRENT_USER){
        toast("Il tuo account è stato eliminato da un amministratore.","err");
        clearSubs(); PROFILE=null; CURRENT_USER=null;
        signOut(auth); render();
      }
      return;
    }
    const data=snap.data();
    if(data.banned){
      toast("Il tuo account è stato sospeso da un amministratore.","err");
      clearSubs(); PROFILE=null; CURRENT_USER=null;
      signOut(auth); render();
      return;
    }
    if(data.forceLogout){
      updateDoc(doc(db,"users",user.uid),{forceLogout:false}).catch(()=>{});
      toast("Sei stato disconnesso da un amministratore.","err");
      clearSubs(); PROFILE=null; CURRENT_USER=null;
      signOut(auth); render();
      return;
    }
    PROFILE = data;
    if(first){ first=false; grantOfflineReward(); }
    render();
  }, err=>{
    console.error(err);
    toast("Errore di connessione a Firestore — controlla le regole","err");
  });
  SUBS.push(unsub);
});

setInterval(()=>{
  if(!PROFILE) return;
  if(VIEW==="home"){ applyDecay(PROFILE.pet); render(); }
  else if(VIEW==="visit" && TEMP.visitId){ renderVisit(); }
  else if(VIEW==="social" && (TEMP.socialTab||"friends")==="friends"){ renderFriendsTab(); }
  else if(VIEW==="admin" && (TEMP.adminTab||"users")==="users"){ renderAdminUsers(); }
},10000);

render();
</script>
</body>
</html>
